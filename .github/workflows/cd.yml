name: CD Pipeline

on:
  push:
    tags:
      - 'v*' # Τρέχει όταν κάνεις git tag (π.χ. git tag v1.0.0 && git push origin v1.0.0)

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and Push Revision-Compliant Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile # Διορθώθηκε με βάση το project tree σου
          push: true
          # Κάνει push δύο tags: το :latest ΚΑΙ το συγκεκριμένο version tag (π.χ. :v1.0.0)
          tags: |
            your-dockerhub-username/network-intrusion-api:latest
            your-dockerhub-username/network-intrusion-api:${{ github.ref_name }}