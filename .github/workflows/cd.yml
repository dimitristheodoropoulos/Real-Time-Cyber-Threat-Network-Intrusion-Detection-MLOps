name: CD Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and Push Revision-Compliant Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile   # Βεβαιώσου ότι υπάρχει Dockerfile στο root
          push: true
          tags: |
            dimitristheodoropoulos/finance-automation-api:latest
            dimitristheodoropoulos/finance-automation-api:${{ github.ref_name }}