name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # ΚΡΙΣΙΜΟ: Εγκατάσταση Java για να μπορεί να τρέξει ο PySpark κατά τα tests
      - name: Set up Java for PySpark Workloads
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
      - name: Lint with flake8
        run: |
          # Σταματάει αν υπάρχουν Python syntax errors ή undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          
      - name: Test Infrastructure with pytest
        run: |
          pytest